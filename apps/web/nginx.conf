# One address for everything (ADR 0108): the game at /, the Track builder at
# /builder/, and the API — HTTP and every Lobby's WebSocket (/api/match/<port>,
# which the API itself carries to the Lobby, ADR 0107) — at /api/.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # A Revision's Thumbnail rides the publish body (ADR 0085, ~1 MB at most).
  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://api:8081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # A Lobby socket stays open for a whole Match.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Both are single-page apps: an unknown path is theirs to route.
  location /builder/ {
    try_files $uri $uri/ /builder/index.html;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
