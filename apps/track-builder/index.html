<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DON'T FALL — Track builder</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font: 13px/1.4 ui-monospace, monospace; color: #cdd9e5; }
      #app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr auto; height: 100%; }
      #palette { grid-row: 1 / 3; overflow-y: auto; background: #10141c; border-right: 1px solid #232a36; padding: 8px; }
      #palette h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8ba0b8; margin: 4px 4px 8px; }
      .module-entry { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 10px; cursor: pointer; border: 1px solid #232a36; border-radius: 4px; padding: 6px; }
      .module-entry:hover { border-color: #4a90d9; }
      .module-entry canvas { display: block; background: #05070b; border-radius: 3px; }
      .module-entry span { font-size: 11px; color: #a8b8c8; }
      #viewport { position: relative; }
      #viewport canvas { display: block; }
      #inspector {
        position: absolute; top: 12px; right: 12px; width: 200px;
        background: rgba(16, 20, 28, 0.9); border: 1px solid #232a36; border-radius: 4px; padding: 10px;
      }
      #inspector[hidden] { display: none; }
      #inspector h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8ba0b8; }
      #inspector .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
      #inspector button { background: #1c2430; color: #cdd9e5; border: 1px solid #2f3b4c; border-radius: 3px; padding: 4px 8px; font: inherit; cursor: pointer; flex: 1; }
      #inspector button:hover { border-color: #4a90d9; }
      #inspector button.active { background: #2a4a72; border-color: #4a90d9; }
      #inspector .axis-label { font-size: 10px; color: #5a6b80; text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 2px; }
      #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #5a6b80; line-height: 1.6; }
      #browse {
        position: absolute; top: 12px; left: 12px; width: 220px; max-height: 60%; overflow-y: auto;
        background: rgba(16, 20, 28, 0.9); border: 1px solid #232a36; border-radius: 4px; padding: 10px;
      }
      #browse[hidden] { display: none; }
      #browse h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8ba0b8; }
      .track-entry { padding: 6px; border: 1px solid #232a36; border-radius: 3px; margin-bottom: 6px; cursor: pointer; }
      .track-entry:hover { border-color: #4a90d9; }
      .track-entry .name { display: block; color: #cdd9e5; }
      .track-entry .id { display: block; font-size: 10px; color: #5a6b80; }
      #toolbar { grid-column: 2; display: flex; gap: 8px; align-items: center; padding: 8px; background: #10141c; border-top: 1px solid #232a36; flex-wrap: wrap; }
      #toolbar input { background: #05070b; color: #cdd9e5; border: 1px solid #232a36; border-radius: 3px; padding: 4px 6px; font: inherit; }
      #toolbar button { background: #1c2430; color: #cdd9e5; border: 1px solid #2f3b4c; border-radius: 3px; padding: 4px 10px; font: inherit; cursor: pointer; }
      #toolbar button:hover { border-color: #4a90d9; }
      #toolbar button:disabled { opacity: 0.4; cursor: default; }
      #status { font-size: 11px; color: #8ba0b8; margin-left: auto; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="palette">
        <h2>Modules</h2>
        <div id="palette-list"></div>
      </div>
      <div id="viewport">
        <div id="browse" hidden>
          <h3>Browse Tracks</h3>
          <div id="browse-list"></div>
        </div>
        <div id="inspector" hidden>
          <h3>Selected</h3>
          <div id="inspector-label"></div>
          <div class="axis-label">drag gizmo</div>
          <div class="row">
            <button id="gizmo-move">Move</button>
            <button id="gizmo-rotate">Rotate</button>
          </div>
          <div class="row">
            <button id="rotate-left">↺ 90°</button>
            <button id="rotate-right">↻ 90°</button>
          </div>
          <div class="axis-label">keyboard rotate axis</div>
          <div class="row">
            <button id="axis-yaw" class="active">Yaw</button>
            <button id="axis-pitch">Pitch</button>
            <button id="axis-roll">Roll</button>
          </div>
          <div class="row">
            <button id="duplicate">Duplicate</button>
            <button id="delete">Delete</button>
          </div>
        </div>
        <div id="hint">
          click a Module to select it · click empty space to deselect<br />
          drag the gizmo to move/rotate · hold Shift for a finer snap<br />
          arrows/PageUp/PageDown move selected · [ ] rotate on the active axis · hold Shift for fine steps
        </div>
      </div>
      <div id="toolbar">
        <label>track-service <input id="service-url" value="http://localhost:8081" size="24" /></label>
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="remove-last">Remove last</button>
        <button id="playtest">Playtest</button>
        <label>name <input id="track-name" placeholder="my track" size="16" /></label>
      <label>time limit (s) <input id="time-limit" type="number" min="10" max="1800" step="5" value="180" size="5" /></label>
        <button id="save">Save</button>
        <label>id <input id="track-id" placeholder="m1-playground" size="16" /></label>
        <button id="load">Load</button>
        <button id="browse-toggle">Browse</button>
        <span id="status"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
