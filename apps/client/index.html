<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DON'T FALL</title>
    <style>
      /* Pre-paint fallback, matching --df-color-surface-0 — src/app.css
         takes over via the token itself once it loads. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
    </style>
  </head>
  <body>
    <!--
      React owns this element as the app shell's root (ADR 0008, M4 ticket
      06) — routing, the Main Menu, and every other Screen render here.
      `<GameCanvas>` (src/game/GameCanvas.tsx) is the one exception: it
      renders a plain, React-untouched div and hands that div to the game's
      own bootstrap (src/game.ts, M4 ticket 01), which mounts its canvas and
      HUD into it directly and tears them down again on teardown. The game
      loop never runs through React either way.
    -->
    <div id="game"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
