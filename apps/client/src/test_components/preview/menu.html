<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/styles/global.css">
<link rel="stylesheet" href="../src/ui/Stage.module.css">
<link rel="stylesheet" href="../src/ui/JellyButton.module.css">
<link rel="stylesheet" href="../src/ui/Logo.module.css">
<link rel="stylesheet" href="../src/ui/Avatar.module.css">
<link rel="stylesheet" href="../src/ui/RenderSlot.module.css">
<link rel="stylesheet" href="../src/ui/Pill.module.css">
<link rel="stylesheet" href="../src/screens/MainMenu.module.css">
<style>body{display:grid;place-items:center;min-height:100dvh;padding:1rem}.frame{width:100%;max-width:1100px}</style>
</head><body>
<div class="frame"><div class="outer"><div class="stage" data-df-feel="snappy" style="background:var(--df-stage-menu)">
  <div class="sheen" style="background:var(--df-sheen-menu)"></div>
  <div class="content screen">
    <header class="header">
      <div class="identity">
        <div class="logo chrome" style="--df-logo-size:calc(var(--df-u) * 2.65)">
          <div class="mark" style="--df-mark-size:calc(var(--df-u) * 2.2525)"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="word"><span class="tag">DON&rsquo;T</span><span class="tumble"><span>F</span><span>A</span><span>L</span><span>L</span></span></div>
        </div>
      </div>
      <div class="identity">
        <div class="account">
          <div class="avatar pink" style="--df-avatar-size:calc(var(--df-u) * 3)"></div>
          <span class="accountText"><span class="name">NOODLEBEAN</span><span class="level">LEVEL 42</span></span>
        </div>
        <button class="iconBtn"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"/></svg></button>
      </div>
    </header>
    <div class="body">
      <div class="actions">
        <button class="btn hero"><span class="body"><span class="kicker">QUICK MATCH · 3 244 BEANS ONLINE</span><span class="label">PLAY</span></span><span class="glyph"><svg viewBox="0 0 26 30"><path d="M0 0l26 15L0 30z"/></svg></span></button>
        <div class="modes">
          <button class="btn tile" style="--df-btn-bg:var(--df-color-danger);--df-btn-shade:var(--df-color-danger-shade);--df-btn-ink:var(--df-color-on-brand)"><span class="body"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span><span class="label">SURVIVAL</span><span class="sub">LAST BEAN STANDING</span></span></button>
          <button class="btn tile" style="--df-btn-bg:var(--df-color-go);--df-btn-shade:var(--df-color-go-shade);--df-btn-ink:var(--df-color-go-ink)"><span class="body"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 14v6M14.25 17h6"/></svg></span><span class="label">BUILD</span><span class="sub">4 DRAFT TRACKS</span></span></button>
        </div>
        <nav class="nav">
          <button class="btn pill centered" style="--df-btn-bg:var(--df-color-glass);--df-btn-shade:var(--df-color-shadow)"><span class="body"><span class="label">DISCOVER</span></span></button>
          <button class="btn pill centered" style="--df-btn-bg:var(--df-color-glass);--df-btn-shade:var(--df-color-shadow)"><span class="body"><span class="label">LEADERBOARDS</span></span></button>
          <button class="btn pill centered" style="--df-btn-bg:var(--df-color-glass);--df-btn-shade:var(--df-color-shadow)"><span class="body"><span class="label">COLLECTION</span></span></button>
        </nav>
      </div>
      <div class="slot grounded wobble hero"><span class="caption">EXISTING CHARACTER RENDER<br>IDLE + WIN POSE LOOP</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="statLabel">BEST SURVIVAL</span><span class="statValue">06:11</span></div>
      <div class="stat"><span class="statLabel">WINS</span><span class="statValue">137</span></div>
      <div class="stat"><span class="statLabel">GRABS BROKEN</span><span class="statValue statAccent">892</span></div>
    </div>
  </div>
</div></div></div></body></html>
