<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYPE — fan, air, float</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #1b1030; }
      canvas { display: block; }
      .panel { position: fixed; background: rgba(255,255,255,.92); border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
      #state { top: 12px; left: 12px; white-space: pre; min-width: 230px; }
      #tuning { top: 12px; right: 12px; width: 280px; max-height: calc(100vh - 110px); overflow: auto; }
      #tuning h3 { margin: 8px 0 4px; font-size: 11px; letter-spacing: .08em; color: #7b3fe4; }
      #tuning label { display: grid; grid-template-columns: 110px 1fr 44px; gap: 6px; align-items: center; margin: 2px 0; }
      #tuning input[type=range] { width: 100%; }
      #tuning button { margin-top: 8px; width: 100%; }
      #tuning .hint { margin: 4px 0 0; color: #6b6480; font-size: 11px; }
      #bar { bottom: 16px; left: 50%; translate: -50% 0; display: flex; gap: 10px; align-items: center; background: #1b1030; color: #fff; border-radius: 999px; padding: 8px 14px; }
      #bar button { background: #fff; color: #1b1030; border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
      #bar .on { background: #7b3fe4; color: #fff; }
      #bar .label { min-width: 250px; text-align: center; font-weight: 700; }
      .tag { position: fixed; bottom: 16px; left: 12px; background: #ffd166; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="state" class="panel"></div>
    <div id="tuning" class="panel"></div>
    <div id="bar" class="panel"></div>
    <div class="tag">PROTOTYPE — throwaway</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
