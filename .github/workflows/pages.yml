# The game and the Track builder on GitHub Pages (ADR 0107): built on every
# push to main (or by hand from the Actions tab) and deployed with the
# official Pages actions. The server is not here — Pages serves files only —
# it runs in a Codespace (`.devcontainer/`, `pnpm online`), and a player's
# link carries its address (`?server=https://…`).
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
        env:
          # A server with a fixed address can be baked in as the default:
          # Settings → Secrets and variables → Actions → Variables → PAGES_SERVER_URL.
          PAGES_SERVER_URL: ${{ vars.PAGES_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
