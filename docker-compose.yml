# Local dev for the single API service (ADR 0058) — tracks, assets, auth,
# and lobbies on one origin, one port. The ephemeral per-Match
# `apps/server` is unaffected: it stays a manually-started process
# (ADR 0002/0011), not part of this compose file.
#
#   docker compose up --build api
#
# The whole game on one address (ADR 0108) — the game at /, the builder at
# /builder/, the API at /api — what a Codespace serves online, and the same
# thing locally on http://localhost:8088:
#
#   docker compose up --build web      (or `pnpm run online`)
#
# Host ports can be moved (a second stack beside the first, say) with
# DONTFALL_API_PORT, DONTFALL_WEB_PORT and DONTFALL_LOBBY_PORTS.
#
# DB GUI (opt-in, localhost only): a lightweight sqlite-web on the same
# SQLite file the API uses (same named volume, so the -shm/-wal sidecars
# stay together — WAL readers need them writable, hence no `:ro` below).
# Behind the `tools` profile so plain `up` never starts it, and with no
# dependency on `api` so it also browses a stopped API's data:
#
#   docker compose --profile tools up db-gui   # then open http://localhost:8082
# (or `pnpm dev --api=docker --db-gui` to start it with everything else)
#
# Port 8082: 8080/8081/5173/5174 are already taken by `scripts/dev.sh`.
# (`--api=local` keeps its own file at `apps/api/data/track-service.sqlite`
# instead of this volume — browse that one with a local SQLite client.)
#
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${DONTFALL_API_PORT:-8081}:8081"
      # Lobby Match servers bind inside this range (`LOBBY_PORT_MIN/MAX`
      # below) — Docker publishes only known ports, so an OS-ephemeral port
      # would be unreachable from the browser and every brokered Lobby would
      # die waiting for its welcome. Local (non-Docker) dev needs none of
      # this: ephemeral ports on localhost just work.
      - "${DONTFALL_LOBBY_PORTS:-51000-51099}:51000-51099"
    environment:
      LOBBY_PORT_MIN: "51000"
      LOBBY_PORT_MAX: "51099"
      # Match-server service token for the betting open/settle calls (ticket
      # 14). Local-dev default, overridable per environment — brokered Match
      # servers share the process env, so no further wiring is needed. Never
      # ship a real deployment on this default.
      SERVICE_TOKEN: "${SERVICE_TOKEN:-local-dev-betting-token}"
      # Voice chat's relay (ADR 0111) — a worker thread of this service with
      # a port of its own. Deliberately not published to the host: nginx
      # reaches it over the compose network (`/api/voice`), and a stack with
      # no nginx in front gets it through the API's own upgrade handler.
      VOICE_PORT: "8083"
    volumes:
      # Deliberately the old volume name: the SQLite file inside keeps its
      # path (`/data/track-service.sqlite`), so existing dev data survives
      # the merge instead of starting on a fresh empty volume. (ADR 0058)
      - track-service-data:/data
  # The game, the builder and the API behind one address (ADR 0108). Built
  # from this checkout like `api`; `pnpm run online` starts both.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${DONTFALL_WEB_PORT:-8088}:80"
    depends_on:
      - api
  # Dev-only SQLite browser (see the header comment). A separate service —
  # not baked into `apps/api/Dockerfile` — so the production API image stays
  # a single-process container with no dev tools inside.
  db-gui:
    image: ghcr.io/coleifer/sqlite-web:latest
    # The image's entrypoint is `sqlite_wsgi -H 0.0.0.0` and takes the
    # database path as its positional argument — it reads no env var, so
    # anything but this `command` fails with "missing required path to
    # database file".
    command: ["/data/track-service.sqlite"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - track-service-data:/data
    profiles:
      - tools

volumes:
  track-service-data:
